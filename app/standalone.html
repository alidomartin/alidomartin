<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMJ Analyzer · AlidoMartin</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
header{padding:1rem 1.25rem .5rem;border-bottom:1px solid #21262d}
.brand{font-size:.65rem;color:#58a6ff;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.15rem}
h1{font-size:1.3rem;font-weight:700}
h1 em{font-style:normal;color:#58a6ff}
#chart-wrap{padding:.5rem}
#chart{height:280px}
@media(min-width:768px){#chart{height:400px}}
.pills-wrap{padding:.25rem 1rem .5rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills-wrap::-webkit-scrollbar{display:none}
.pill{display:inline-block;margin-right:.4rem;padding:.42rem .9rem;border-radius:999px;border:2px solid;cursor:pointer;font-size:.78rem;font-weight:600;background:transparent;color:#e6edf3;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.pill.active{color:#0d1117!important}
#phase-info{padding:.75rem 1.25rem 1.5rem;border-top:1px solid #21262d;min-height:120px}
.ph-name{font-size:1rem;font-weight:700;margin-bottom:.3rem}
.ph-desc{font-size:.78rem;color:#8b949e;line-height:1.55;margin-bottom:.7rem}
.metrics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem}
@media(min-width:420px){.metrics-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.metrics-grid{grid-template-columns:repeat(4,1fr)}}
.mc{background:#161b22;border:1px solid #30363d;border-radius:.5rem;padding:.55rem .7rem}
.mc .lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;color:#8b949e;margin-bottom:.15rem}
.mc .val{font-size:.95rem;font-weight:700}
footer{text-align:center;font-size:.65rem;color:#484f58;padding:.75rem;border-top:1px solid #21262d}
</style>
</head>
<body>
<header>
  <p class="brand">Sports Science Tool</p>
  <h1>CMJ <em>Analyzer</em></h1>
</header>
<div id="chart-wrap"><div id="chart"></div></div>
<div class="pills-wrap" id="pills"></div>
<div id="phase-info">
  <p style="color:#484f58;font-size:.82rem;padding-top:.25rem">Select a phase above to explore metrics</p>
</div>
<footer>by AlidoMartin &middot; Countermovement Jump Force-Time Analysis</footer>

<script>
// ── Utilities ──────────────────────────────────────────────────────────────
const BW = 700, FS = 500;

function linspace(a, b, n) {
  const r = [];
  for (let i = 0; i < n; i++) r.push(a + (b - a) * i / (n - 1));
  return r;
}

// Seeded PRNG (Mulberry32)
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Box-Muller Gaussian noise
function gauss(rng) {
  const u = rng() || 1e-10, v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// 1-D Gaussian convolution
function gaussianFilter(arr, sigma) {
  const r = Math.ceil(3 * sigma);
  const k = [], n = 2 * r + 1;
  let s = 0;
  for (let i = 0; i < n; i++) { const w = Math.exp(-0.5 * ((i - r) / sigma) ** 2); k.push(w); s += w; }
  const kn = k.map(w => w / s);
  return arr.map((_, i) => {
    let v = 0;
    kn.forEach((w, j) => { v += w * arr[Math.max(0, Math.min(arr.length - 1, i - r + j))]; });
    return Math.round(v * 100) / 100;
  });
}

// ── CMJ Curve Generation (ported from generate_plots.py) ───────────────────
function buildCurve() {
  const n = Math.floor(2.90 * FS);
  const t = Array.from({length: n}, (_, i) => parseFloat((i / FS).toFixed(4)));
  const f = new Array(n).fill(BW);
  const ix = s => Math.floor(s * FS);

  // Quiet — small noise
  const rng = mulberry32(42);
  for (let i = 0; i < ix(1.00); i++) f[i] = BW + gauss(rng) * 4;

  // Unweighting
  let [s, e] = [ix(1.00), ix(1.30)];
  linspace(0, Math.PI, e - s).forEach((x, i) => { f[s + i] = BW - 280 * Math.sin(x) ** 1.4; });

  // Braking
  [s, e] = [ix(1.30), ix(1.55)];
  const sf = f[s - 1], pb = BW * 1.75;
  linspace(0, 1, e - s).forEach((x, i) => { f[s + i] = sf + (pb - sf) * (3*x**2 - 2*x**3); });

  // Propulsive
  [s, e] = [ix(1.55), ix(1.81)];
  linspace(0, 1, e - s).forEach((x, i) => { f[s + i] = BW * 2.1 * Math.sin(Math.PI * x) ** 0.75; });
  for (let i = 0; i < 30; i++) f[e - 30 + i] *= (30 - i) / 30;

  // Flight — zero
  for (let i = ix(1.81); i < ix(2.42); i++) f[i] = 0;

  // Landing
  s = ix(2.42);
  const nL = n - s;
  linspace(0, 1, nL).forEach((x, i) => {
    f[s + i] = BW
      + 1800 * Math.exp(-x * 12) * (1 - Math.exp(-x * 60))
      + 400  * Math.exp(-x * 5)  * Math.cos(2 * Math.PI * x * 3);
  });
  const f8 = f[s + 8];
  for (let i = 0; i < 8; i++) f[s + i] = f8 * i / 8;

  // Smooth + clamp flight
  const fSmooth = gaussianFilter(f, 2);
  for (let i = ix(1.81); i < ix(2.42); i++) fSmooth[i] = 0;

  return { t, f: fSmooth };
}

// ── Metric Helpers ──────────────────────────────────────────────────────────
const { t, f } = buildCurve();

function pk(s, e)  { let m = -Infinity; t.forEach((v,i) => { if (v>=s&&v<=e&&f[i]>m) m=f[i]; }); return Math.round(m*10)/10; }
function mn(s, e)  { let m = Infinity;  t.forEach((v,i) => { if (v>=s&&v<=e&&f[i]<m) m=f[i]; }); return Math.round(m*10)/10; }
function avg(s, e) { let sum=0,cnt=0;   t.forEach((v,i) => { if (v>=s&&v<=e) { sum+=f[i]; cnt++; } }); return Math.round(sum/cnt*10)/10; }

const ft   = 2.42 - 1.81;
const jhM  = Math.round((9.81 * ft ** 2 / 8) * 1000) / 1000;
const jhC  = Math.round(jhM * 1000) / 10;

// ── Phase Definitions ───────────────────────────────────────────────────────
const PHASES = {
  quiet:      { label:'Quiet Phase',      color:'#A8D5E2', start:0.00, end:1.00,
                desc:'Athlete stands still for ≥1 s. System weight is established here — cue athletes to be completely still.',
                metrics:{ 'Body Weight': avg(0,1)+' N', 'Duration':'1.00 s' }},
  unweight:   { label:'Unweighting',      color:'#F5E642', start:1.00, end:1.30,
                desc:'Agonist muscles relax, force drops below body weight. The athlete is essentially in free fall.',
                metrics:{ 'Min Force': mn(1.0,1.3)+' N', 'Deficit': (BW-mn(1.0,1.3)).toFixed(1)+' N below BW', 'Duration':'0.30 s' }},
  braking:    { label:'Braking Phase',    color:'#F08080', start:1.30, end:1.55,
                desc:'COM decelerates from peak negative velocity toward zero. Eccentric strength is the key driver.',
                metrics:{ 'Peak Force': pk(1.3,1.55)+' N', 'Relative': (pk(1.3,1.55)/BW).toFixed(2)+'× BW', 'Duration':'0.25 s' }},
  transfer:   { label:'Transfer Point',   color:'#4472C4', start:1.55, end:1.55,
                desc:'COM velocity = 0. The amortization point. Less time here = more reactive, efficient athlete.',
                metrics:{ 'Time':'1.55 s', 'COM Velocity':'0 m/s' }},
  propulsive: { label:'Propulsive Phase', color:'#90EE90', start:1.55, end:1.81,
                desc:'Forceful hip, knee, and ankle extension drives COM upward. Key metrics: PRPP and propulsive impulse.',
                metrics:{ 'Peak Force': pk(1.55,1.81)+' N', 'Relative': (pk(1.55,1.81)/BW).toFixed(2)+'× BW', 'Jump Height': jhC+' cm', 'Duration':'0.26 s' }},
  flight:     { label:'Flight Phase',     color:'#C8A2C8', start:1.81, end:2.42,
                desc:'Airborne phase. Jump height is derived from takeoff velocity — the industry gold standard.',
                metrics:{ 'Flight Time': ft.toFixed(3)+' s', 'Jump Height': jhC+' cm ('+jhM+' m)' }},
  landing:    { label:'Landing Phase',    color:'#FFB347', start:2.42, end:2.90,
                desc:'Impact absorption from touchdown to COM stop. Bilateral asymmetry is critical for return-to-play.',
                metrics:{ 'Peak GRF': pk(2.42,2.9)+' N', 'Relative': (pk(2.42,2.9)/BW).toFixed(2)+'× BW', 'Duration':'0.48 s' }},
};

// ── Chart ───────────────────────────────────────────────────────────────────
function renderChart(activeKey) {
  const traces = [];

  traces.push({
    x: t, y: t.map(() => BW),
    mode: 'lines',
    line: { color: '#484f58', width: 1, dash: 'dot' },
    name: 'Body Weight ('+BW+' N)',
    hoverinfo: 'skip',
  });

  Object.entries(PHASES).forEach(([key, ph]) => {
    if (ph.start === ph.end) return;
    const inR = (_, i) => t[i] >= ph.start && t[i] <= ph.end;
    traces.push({
      x: t.filter(inR), y: f.filter(inR),
      fill: 'tozeroy',
      fillcolor: ph.color + (key === activeKey ? '66' : '1a'),
      line: { width: 0 },
      showlegend: false,
      hoverinfo: 'skip',
    });
  });

  traces.push({
    x: t, y: f,
    mode: 'lines',
    line: { color: '#c9d1d9', width: 2 },
    name: 'Vertical GRF',
    hovertemplate: '%{y:.0f} N<extra></extra>',
  });

  const tpIdx = t.findIndex(v => Math.abs(v - 1.55) < 0.004);

  Plotly.react('chart', traces, {
    paper_bgcolor: 'transparent',
    plot_bgcolor: 'transparent',
    margin: { t: 6, r: 10, b: 38, l: 52 },
    xaxis: { title: 'Time (s)', color: '#8b949e', gridcolor: '#21262d', zeroline: false, tickfont: { size: 10, color: '#8b949e' } },
    yaxis: { title: 'Force (N)', color: '#8b949e', gridcolor: '#21262d', zeroline: false, tickfont: { size: 10, color: '#8b949e' } },
    legend: { x: 0, y: 1, font: { color: '#8b949e', size: 9 }, bgcolor: 'transparent', orientation: 'h' },
    hovermode: 'x unified',
    shapes: tpIdx >= 0 ? [{
      type: 'line', x0: 1.55, x1: 1.55, y0: 0, y1: f[tpIdx] + 80,
      line: { color: '#4472C4', width: 2, dash: 'dash' },
    }] : [],
  }, { responsive: true, displayModeBar: false });
}

function buildPills() {
  const wrap = document.getElementById('pills');
  Object.entries(PHASES).forEach(([key, ph]) => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.textContent = ph.label;
    btn.style.borderColor = ph.color;
    btn.dataset.key = key;
    btn.addEventListener('click', () => selectPhase(key));
    wrap.appendChild(btn);
  });
}

function selectPhase(key) {
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.remove('active');
    p.style.background = 'transparent';
    p.style.color = '#e6edf3';
  });
  const btn = document.querySelector('.pill[data-key="'+key+'"]');
  const ph = PHASES[key];
  btn.classList.add('active');
  btn.style.background = ph.color;
  renderChart(key);
  const cards = Object.entries(ph.metrics)
    .map(([l, v]) => '<div class="mc"><div class="lbl">'+l+'</div><div class="val">'+v+'</div></div>')
    .join('');
  document.getElementById('phase-info').innerHTML =
    '<p class="ph-name" style="color:'+ph.color+'">'+ph.label+'</p>' +
    '<p class="ph-desc">'+ph.desc+'</p>' +
    '<div class="metrics-grid">'+cards+'</div>';
}

renderChart(null);
buildPills();
</script>
</body>
</html>
