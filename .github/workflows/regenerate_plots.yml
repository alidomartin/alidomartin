name: Regenerate Plots

on:
  push:
    branches: [main]
    paths:
      - "generate_plots.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install numpy matplotlib scipy

      - name: Generate plots
        run: python generate_plots.py

      - name: Commit updated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git diff --cached --quiet || git commit -m "chore: regenerate CMJ phase plots [skip ci]"
          git push
